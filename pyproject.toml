[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aarvia"
version = "0.6.8"
description = "Career navigation and fact-grounded job application agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.66"]

[project.scripts]
aarvia = "aarvia.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aarvia = ["catalog_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
